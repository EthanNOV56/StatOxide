[workspace]
members = ["crates/*"]

resolver = "2"

[workspace.package]
name = "statoxide"
version = "0.2.0"
edition = "2024"
authors = ["EthanNov56 <yichen_1226@163.com>"]
description = "High-performance statistical computing library written in Rust, exposed to Python via PyO3"
license = "MIT AND Apache-2.0"
repository = "https://github.com/EthanNOV56/StatOxide"
readme = "README.md"
keywords = ["statistics", "regression", "machine-learning", "data-science"]
categories = ["science", "data-structures"]

[workspace.dependencies]
ndarray = { version = "0.17.1", features = ["serde"] }
thiserror = "2.0.17"
rand = "0.9.2"
faer = "0.23.2"
serde = { version = "1.0", features = ["derive"] }
statrs = "0.16"
ndarray-stats = "0.6"
rand_distr = "0.4"
approx = "0.5"
rayon = "1.7"
chrono = "0.4"
nom = "7.1"
anyhow = "1.0"
serde_json = "1.0"

so-core = "0.2.0"
so-linalg = "0.2.0"
so-models = "0.2.0"
so-stats = "0.2.0"
so-tsa = "0.2.0"
so-utils = "0.2.0"

[workspace.dev-dependencies]
criterion = "0.5"
proptest = "1.3"
