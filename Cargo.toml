[package]
name = "statoxide"
version = "0.1.0"
edition = "2024"
description = "A high-performance statistical modeling library with Python/R bindings"
authors = ["tip <tip@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tip/statoxide"
readme = "README.md"
keywords = ["statistics", "regression", "machine-learning", "data-science"]
categories = ["science", "data-structures"]

# Build Python extension module
[lib]
name = "statoxide"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core numerical computing
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-stats = "0.6"
ndarray-linalg = { version = "0.17", features = ["openblas-static"] }
nalgebra = { version = "0.35", features = ["sparse"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
approx = "0.5"

# Statistics and distributions
statrs = "0.16"
distributions = "0.2"

# Linear algebra and optimization
linfa = { version = "0.8", features = ["openblas"] }
smartcore = { version = "0.4", features = ["nalgebra-bindings"] }

# Data processing and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.7"

# Parsing
nom = "7.1"

# Python bindings (optional)
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.21", optional = true }

[features]
default = []
python = ["pyo3", "numpy", "pyo3/auto-initialize"]

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
proptest = "1.3"

[[bench]]
name = "regression"
harness = false

[[bench]]
name = "optimization"
harness = false

[[bench]]
name = "distributions"
harness = false