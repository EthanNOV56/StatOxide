[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "statoxide"
version = "0.1.0"
description = "A high-performance statistical modeling library with Python/R bindings"
readme = "README.md"
authors = [{name = "tip", email = "tip@example.com"}]
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/tip/statoxide"
Documentation = "https://statoxide.org"
Repository = "https://github.com/tip/statoxide"
Changelog = "https://github.com/tip/statoxide/releases"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-benchmark>=4.0", "hypothesis>=6.0"]
dev = ["black>=23.0", "mypy>=1.0", "ruff>=0.1", "jupyter>=1.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=1.0", "nbsphinx>=0.9"]
examples = ["numpy>=1.20", "pandas>=1.3", "scikit-learn>=1.0", "matplotlib>=3.5"]

[tool.maturin]
features = ["python"]
module-name = "statoxide"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.black]
line-length = 88
target-version = ['py38']